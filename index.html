<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metalúrgica Digital</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div id="icone-robo">
        <div class="robo-icon-box">
          <img id="robo-img" src="robo.svg" alt="Robô" />
        </div>

        <div class="marca-info">
          <div class="marca-linha">
            <strong id="robo-text">METALÚRGICA DIGITAL</strong>

            <span class="versao">IHM v2.4</span>

            <span class="status-iot">● IoT Online</span>
          </div>

          <small class="descricao">
            Planta Industrial • Células Robotizadas e Estamparia
          </small>
        </div>
      </div>
      <nav class="navegacao">
        <a href="#monitoramento" class="card-nav">
          <span class="icone">🔔</span>
          <strong>Monitoramento e alertas</strong>
        </a>

        <a href="#detalhes" class="card-nav">
          <span class="icone">🤖</span>
          <strong>Detalhes do robô / ativo</strong>
        </a>

        <a href="#ordens" class="card-nav">
          <span class="icone">🛠️</span>
          <strong>Ordem de serviço</strong>
        </a>

        <a href="#comunicados" class="card-nav">
          <span class="icone">📢</span>
          <strong>Comunicados e decisões</strong>
        </a>
      </nav>
    </header>
    <script src="script.js"></script>
  </body>
</html>
